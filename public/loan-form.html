<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Loan Referral – Openhouse</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#111827;--muted:#6b7280;--line:#e5e7eb;--soft:#f9fafb;
  --accent:#4f46e5;--ok:#166534;--warn:#b45309;--err:#b91c1c;
}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#f3f4f6;color:var(--ink);
  line-height:1.55;padding:28px 16px 80px;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto}
header{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:16px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin-bottom:14px}
.card h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
label{display:block;font-size:12.5px;font-weight:600;color:#374151;margin-bottom:5px}
.req{color:var(--err)}
input[type=text],input[type=tel],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
  font:inherit;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
textarea{resize:vertical;min-height:76px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.ferr{font-size:12px;color:var(--err);margin-top:4px;min-height:0}
.has-err input,.has-err select,.has-err textarea{border-color:var(--err)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.seg button{border:0;background:#fff;font:inherit;font-size:13.5px;font-weight:600;padding:8px 16px;cursor:pointer;color:#374151}
.seg button.on{background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:#374151}
.chip.on{background:#eef2ff;border-color:#c7d2fe;color:#3730a3}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:#374151}
.consent input{margin-top:3px;width:16px;height:16px;flex-shrink:0}
.btn{border:0;border-radius:7px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:10px 18px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:6px}
.status{font-size:13px;min-height:1em}
.status.err{color:var(--err)}
.status.busy{color:var(--muted)}
.done{background:#fff;border:1px solid var(--line);border-radius:12px;padding:36px 28px;text-align:center}
.done h2{font-size:19px;font-weight:700;color:var(--ok);margin-bottom:8px}
.ref{font-family:ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;background:var(--soft);
  border:1px solid var(--line);border-radius:6px;padding:5px 11px;display:inline-block;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Home Loan Referral</h1>
    <p class="sub">Tell us about the client and the home. Openhouse's loan desk will call them.</p>
  </header>

  <form id="loanForm" novalidate>
    <div class="card">
      <h2>Client</h2>
      <div class="grid">
        <div data-f="firstName"><label>First name <span class="req">*</span></label>
          <input type="text" name="firstName" maxlength="50" autocomplete="given-name"><div class="ferr"></div></div>
        <div data-f="lastName"><label>Last name <span class="req">*</span></label>
          <input type="text" name="lastName" maxlength="50" autocomplete="family-name"><div class="ferr"></div></div>
        <div data-f="clientMobile"><label>Mobile <span class="req">*</span></label>
          <input type="tel" name="clientMobile" inputmode="numeric" maxlength="10" placeholder="10 digits, no +91"><div class="ferr"></div></div>
        <div data-f="clientPan"><label>PAN</label>
          <input type="text" name="clientPan" maxlength="10" placeholder="ABCDE1234F" style="text-transform:uppercase"><div class="ferr"></div></div>
        <div data-f="employmentType"><label>Employment</label>
          <select name="employmentType"><option value="">Select…</option>
            <option value="salaried">Salaried</option><option value="self_employed">Self-employed</option></select>
          <div class="ferr"></div></div>
        <div data-f="loanAmountRequested"><label>Loan amount (₹)</label>
          <input type="text" name="loanAmountRequested" inputmode="numeric" placeholder="e.g. 7000000">
          <div class="hint" id="amtHint"></div><div class="ferr"></div></div>
      </div>
    </div>

    <div class="card" data-f="property">
      <h2>Property</h2>
      <div class="seg" id="kindSeg">
        <button type="button" data-kind="openhouse" class="on">Openhouse property</button>
        <button type="button" data-kind="other">Other property</button>
      </div>
      <div id="ohBox">
        <label>Openhouse property <span class="req">*</span></label>
        <input type="text" id="homeSearch" placeholder="Type to filter by society, tower or unit…" style="margin-bottom:8px">
        <select id="homeSel"><option value="">Loading properties…</option></select>
      </div>
      <div id="otherBox" style="display:none">
        <label>Address <span class="req">*</span></label>
        <textarea name="address" maxlength="250" placeholder="Tower A, Flat 1203, Sector 16"></textarea>
        <label style="margin-top:12px">City <span class="req">*</span></label>
        <div class="chips" id="cityChips">
          <button type="button" class="chip" data-city="1">Gurgaon</button>
          <button type="button" class="chip" data-city="2">Noida</button>
          <button type="button" class="chip" data-city="4">Ghaziabad</button>
          <button type="button" class="chip" data-city="other">Other city</button>
        </div>
        <input type="text" id="cityName" maxlength="80" placeholder="City name" style="display:none;margin-top:8px">
      </div>
      <div class="ferr"></div>
    </div>

    <div class="card">
      <h2>Anything else</h2>
      <div data-f="note"><label>Note</label>
        <textarea name="note" maxlength="500" placeholder="e.g. Wants disbursal before Diwali"></textarea><div class="ferr"></div></div>
      <div data-f="consent" style="margin-top:14px">
        <label class="consent"><input type="checkbox" name="consent">
          <span>My client has agreed to be contacted by Openhouse and its lending partners about a home loan.</span></label>
        <div class="ferr"></div>
      </div>
    </div>

    <div class="foot">
      <button type="submit" class="btn btn-primary" id="submitBtn">Submit referral</button>
      <span class="status" id="status"></span>
    </div>
  </form>

  <div class="done" id="done" style="display:none">
    <h2>Referral received</h2>
    <p class="sub">Our loan desk will call the client shortly.</p>
    <div class="ref" id="refNo"></div>
  </div>
</div>

<script>
// Posts to /api/loan/submit, which stores a referral ticket in the same table the
// Transaction CRM's Loans tab and the Partner App work from (no broker attached).
const $ = (s) => document.querySelector(s);
const form = $('#loanForm');
let kind = 'openhouse', cityChoice = null, homes = [];

function lakhs(n) {
  if (!n) return '';
  return n >= 1e7 ? `₹${(n / 1e7).toFixed(2)} Cr` : `₹${(n / 1e5).toFixed(2)} L`;
}
form.loanAmountRequested.addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '');
  $('#amtHint').textContent = lakhs(Number(e.target.value));
});
form.clientMobile.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10); });

document.querySelectorAll('#kindSeg button').forEach((b) => b.addEventListener('click', () => {
  kind = b.dataset.kind;
  document.querySelectorAll('#kindSeg button').forEach((x) => x.classList.toggle('on', x === b));
  $('#ohBox').style.display = kind === 'openhouse' ? '' : 'none';
  $('#otherBox').style.display = kind === 'other' ? '' : 'none';
}));
document.querySelectorAll('#cityChips .chip').forEach((c) => c.addEventListener('click', () => {
  cityChoice = c.dataset.city;
  document.querySelectorAll('#cityChips .chip').forEach((x) => x.classList.toggle('on', x === c));
  $('#cityName').style.display = cityChoice === 'other' ? '' : 'none';
}));

function renderHomes(filter) {
  const f = (filter || '').trim().toLowerCase();
  const list = f ? homes.filter((h) => h.title.toLowerCase().includes(f)) : homes;
  const keep = $('#homeSel').value;
  $('#homeSel').innerHTML = `<option value="">${list.length ? 'Select the property…' : 'No matching property'}</option>`
    + list.map((h) => `<option value="${h.homeId}">${h.title.replace(/</g, '&lt;')}</option>`).join('');
  if (keep && list.some((h) => String(h.homeId) === keep)) $('#homeSel').value = keep;
}
$('#homeSearch').addEventListener('input', (e) => renderHomes(e.target.value));
fetch('/api/loan/homes').then((r) => r.json()).then((d) => { homes = d.homes || []; renderHomes(''); })
  .catch(() => { $('#homeSel').innerHTML = '<option value="">Could not load properties — use "Other property"</option>'; });

function clearErrors() {
  document.querySelectorAll('[data-f]').forEach((el) => {
    el.classList.remove('has-err');
    const fe = el.querySelector(':scope > .ferr'); if (fe) fe.textContent = '';
  });
}
function showErrors(fields) {
  for (const [k, msg] of Object.entries(fields || {})) {
    const el = document.querySelector(`[data-f="${k}"]`);
    if (!el) continue;
    el.classList.add('has-err');
    const fe = el.querySelector(':scope > .ferr'); if (fe) fe.textContent = msg;
  }
  const first = document.querySelector('.has-err'); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErrors();
  const amt = form.loanAmountRequested.value.trim();
  const body = {
    firstName: form.firstName.value.trim(),
    lastName: form.lastName.value.trim(),
    clientMobile: form.clientMobile.value.trim(),
    consent: form.consent.checked,
  };
  if (form.clientPan.value.trim()) body.clientPan = form.clientPan.value.trim().toUpperCase();
  if (form.employmentType.value) body.employmentType = form.employmentType.value;
  if (amt) body.loanAmountRequested = Number(amt);
  if (form.note.value.trim()) body.note = form.note.value.trim();
  if (kind === 'openhouse') {
    body.property = { kind: 'openhouse', homeId: Number($('#homeSel').value) || null };
  } else {
    body.property = { kind: 'other', address: form.address.value.trim() };
    if (cityChoice && cityChoice !== 'other') body.property.cityId = Number(cityChoice);
    else body.property.cityName = $('#cityName').value.trim();
  }

  const btn = $('#submitBtn'), st = $('#status');
  btn.disabled = true; st.className = 'status busy'; st.textContent = 'Submitting…';
  try {
    const r = await fetch('/api/loan/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok) {
      form.style.display = 'none';
      $('#refNo').textContent = `Referral #${d.id}`;
      $('#done').style.display = '';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    if (d.fields) showErrors(d.fields);
    st.className = 'status err'; st.textContent = d.detail || 'Could not submit — please try again.';
  } catch {
    st.className = 'status err'; st.textContent = 'Network error — please try again.';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
